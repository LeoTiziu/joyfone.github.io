<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 400" role="img" aria-label="Tela de controle remoto do Joyfone">
  <!-- Ilustração original da tela "Controle remoto" do app (celular na vertical). -->
  <rect x="10" y="6" width="200" height="388" rx="30" fill="#0B0E13"/>
  <rect x="22" y="20" width="176" height="360" rx="20" fill="#141A23"/>
  <!-- Início / Voltar / Menu -->
  <rect x="34" y="40" width="46" height="30" rx="8" fill="#232C39"/>
  <rect x="87" y="40" width="46" height="30" rx="8" fill="#232C39"/>
  <rect x="140" y="40" width="46" height="30" rx="8" fill="#232C39"/>
  <!-- direcional e OK -->
  <circle cx="110" cy="96" r="18" fill="#232C39"/>
  <circle cx="64" cy="150" r="18" fill="#232C39"/>
  <circle cx="156" cy="150" r="18" fill="#232C39"/>
  <circle cx="110" cy="204" r="18" fill="#232C39"/>
  <circle cx="110" cy="150" r="26" fill="#3DD6C6"/>
  <text x="110" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0F1218">OK</text>
  <!-- volume -->
  <rect x="34" y="244" width="46" height="30" rx="8" fill="#232C39"/>
  <rect x="87" y="244" width="46" height="30" rx="8" fill="#232C39"/>
  <rect x="140" y="244" width="46" height="30" rx="8" fill="#232C39"/>
  <text x="57" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C5CDD8">VOL−</text>
  <text x="163" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C5CDD8">VOL+</text>
  <!-- mídia -->
  <rect x="34" y="282" width="46" height="30" rx="8" fill="#232C39"/>
  <rect x="87" y="282" width="46" height="30" rx="8" fill="#232C39"/>
  <rect x="140" y="282" width="46" height="30" rx="8" fill="#232C39"/>
  <!-- jogar na TV -->
  <rect x="34" y="330" width="152" height="34" rx="17" fill="#3DD6C6"/>
</svg>
