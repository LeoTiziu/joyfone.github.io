<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Celular na horizontal com o controle do Joyfone na tela, ao lado de uma TV">
  <!-- Ilustração original: TV ao fundo, celular em paisagem com o layout padrão do app. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2230"/>
      <stop offset="1" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="tv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15303A"/>
      <stop offset="1" stop-color="#0E1A20"/>
    </linearGradient>
  </defs>
  <!-- TV -->
  <rect x="250" y="20" width="370" height="220" rx="14" fill="#0B0E13"/>
  <rect x="262" y="32" width="346" height="196" rx="6" fill="url(#tv)"/>
  <path d="M262 190 L340 120 L400 160 L470 100 L608 200 L608 228 L262 228 Z" fill="#1E4A52" opacity="0.8"/>
  <circle cx="540" cy="76" r="18" fill="#3DD6C6" opacity="0.35"/>
  <rect x="410" y="240" width="50" height="16" fill="#0B0E13"/>
  <rect x="370" y="256" width="130" height="8" rx="4" fill="#0B0E13"/>
  <!-- Celular -->
  <g transform="rotate(-6 250 300)">
    <rect x="30" y="200" width="430" height="190" rx="30" fill="#0B0E13"/>
    <rect x="46" y="214" width="398" height="162" rx="18" fill="url(#screen)"/>
    <!-- analógico esquerdo -->
    <circle cx="110" cy="300" r="40" fill="#222B38"/>
    <circle cx="122" cy="292" r="20" fill="#3DD6C6"/>
    <!-- direcional -->
    <rect x="178" y="322" width="14" height="40" rx="3" fill="#2E3A4B"/>
    <rect x="165" y="335" width="40" height="14" rx="3" fill="#2E3A4B"/>
    <!-- botões de ação -->
    <circle cx="380" cy="262" r="15" fill="#2E3A4B"/>
    <circle cx="352" cy="290" r="15" fill="#2E3A4B"/>
    <circle cx="408" cy="290" r="15" fill="#3DD6C6"/>
    <circle cx="380" cy="318" r="15" fill="#2E3A4B"/>
    <!-- analógico direito -->
    <circle cx="300" cy="340" r="28" fill="#222B38"/>
    <circle cx="300" cy="340" r="14" fill="#4E5D72"/>
    <!-- gatilhos -->
    <rect x="70" y="226" width="70" height="16" rx="8" fill="#2E3A4B"/>
    <rect x="350" y="226" width="70" height="16" rx="8" fill="#2E3A4B"/>
    <!-- start/select -->
    <rect x="222" y="244" width="22" height="9" rx="4.5" fill="#4E5D72"/>
    <rect x="252" y="244" width="22" height="9" rx="4.5" fill="#4E5D72"/>
  </g>
</svg>
